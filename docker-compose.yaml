services:
  batch-simulator:
    build: .
    container_name: llm_batching_engine
    volumes:
      - .:/app
      
    environment:
      - MODEL_PATH=/app/models/gemma-3-4b-it-q4_k_m.gguf
      - OUTPUT_DIR=/app/results
      - PYTHONPATH=/app

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]